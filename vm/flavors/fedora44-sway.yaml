#cloud-config
# vmctl flavor fedora44-sway: Fedora 44 Cloud + sway 1.11 (wlroots) with Xwayland, foot and
# grim; greetd autologin ([initial_session]) of user test into sway on vt 1.  Native display
# tool: swaymsg -t get_outputs.
#
# The cheapest new flavor in the set and the one that pays first: every one of the six tools
# was measured byte-identical on Fedora's sway 1.11 and Ubuntu's -- wxrandr's sway backend,
# wwmctl, the search/geometry/activate path, `type` through zwp_virtual_keyboard with no
# privilege, wmirror over zwlr_screencopy and ext_image_copy_capture, warandr's GTK bindings
# [recon2/fedora 3.1].  So a red run here is a DISTRO problem and nothing else, which is what
# makes this the host the rpm smoke runs on: `--pkg` installs the three noarch rpms, and the
# `selinux` and `pkgverify` phases (rpm -V) run on top of the ordinary sway list.
#
# greetd-selinux is installed beside greetd: it is what cosmic-greeter's own Requires names on
# Fedora, and greetd writes into /run without it at its peril [recon2/fedora 5].
# The Fedora Sway spin itself uses SDDM; greetd is chosen here so that this flavor and
# resolute-sway differ in the distribution and in nothing else.
#
# vmctl fills in the two @@...@@ placeholders at build time (root ssh public key; the
# contents of vm/build-image.sh). The base image lives in $VMIMAGES:
# vmctl-base: Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
# vmctl-base-sha256: 28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f
# vmctl-desktop: sway
# vmctl-distro: fedora
# vmctl-ci: push
hostname: fedora44-sway
manage_etc_hosts: true
disable_root: false
ssh_pwauth: false
ssh_authorized_keys:
  - @@ROOT_PUBKEY@@
users:
  - name: test
    uid: 1000
    gecos: Test User
    groups: [wheel]
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: test
    sudo: ALL=(ALL) NOPASSWD:ALL
write_files:
  # No `owner:` on any entry here.  write_files runs BEFORE the users module, so
  # `owner: test:test` aborts the whole module with `OSError: Unknown user or
  # group ... 'test'` and cloud-init ends in status: error [recon2/hyprland].
  # Everything under /home/test is chowned by the build script instead.
  - path: /etc/ssh/sshd_config.d/60-vmctl.conf
    content: "PermitRootLogin prohibit-password\n"
  - path: /etc/modules-load.d/uinput.conf
    content: "uinput\n"
  - path: /etc/vmctl-build.env
    content: |
      FLAVOR=fedora44-sway
      DESKTOP=sway
      DESKTOP_PKG="sway-desktop-environment greetd greetd-selinux foot grim xorg-x11-server-Xwayland"
      EXTRA_PKGS="xdotool wmctrl xprop xrandr wl-mirror python3-gobject gtk3 acl xterm"
  - path: /usr/local/sbin/vmctl-build
    permissions: '0755'
    content: |
      @@BUILD_SCRIPT@@
runcmd:
  - [/usr/local/sbin/vmctl-build]
power_state:
  mode: poweroff
  message: vmctl golden build finished
  timeout: 120
