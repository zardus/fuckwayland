#cloud-config
# vmctl flavor resolute-sway: Ubuntu 26.04 LTS (resolute) + sway (wlroots) with Xwayland, foot, grim;
# greetd autologin ([initial_session]) of user test (uid 1000, password test, NOPASSWD sudo) into
# sway on vt 1; the session's outputs are arranged Virtual-1, -2, ... left to right at start.
# Native display tool: swaymsg -t get_outputs.  No NetworkManager here (networkd stays).
# vmctl fills in the two @@...@@ placeholders at build time (root ssh public
# key; the contents of vm/build-image.sh). The base image lives in $VMIMAGES:
# vmctl-base: ubuntu-26.04-server-cloudimg-amd64.img
# vmctl-desktop: sway
# vmctl-distro: ubuntu
# vmctl-ci: push
hostname: resolute-sway
manage_etc_hosts: true
disable_root: false
ssh_pwauth: false
ssh_authorized_keys:
  - @@ROOT_PUBKEY@@
users:
  - name: test
    uid: 1000
    gecos: Test User
    groups: [adm, sudo]
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: test
    sudo: ALL=(ALL) NOPASSWD:ALL
write_files:
  - path: /etc/ssh/sshd_config.d/60-vmctl.conf
    content: "PermitRootLogin prohibit-password\n"
  - path: /etc/modules-load.d/uinput.conf
    content: "uinput\n"
  - path: /etc/vmctl-build.env
    content: |
      FLAVOR=resolute-sway
      DESKTOP=sway
      DESKTOP_PKG="sway swaybg sway-backgrounds xwayland foot grim greetd dbus-user-session"
      EXTRA_PKGS="xdotool wmctrl x11-utils x11-xserver-utils"
  - path: /usr/local/sbin/vmctl-build
    permissions: '0755'
    content: |
      @@BUILD_SCRIPT@@
runcmd:
  - [/usr/local/sbin/vmctl-build]
power_state:
  mode: poweroff
  message: vmctl golden build finished
  timeout: 120
