#cloud-config
# vmctl flavor noble-xfce: Ubuntu 24.04 LTS (noble) + xubuntu-desktop, Xfce 4.18 on Xorg (X11),
# LightDM autologin of user test (uid 1000, password test, NOPASSWD sudo) into the xubuntu session.
# The X11-path oracle: real xrandr/arandr work here.
# vmctl fills in the two @@...@@ placeholders at build time (root ssh public
# key; the contents of vm/build-image.sh). The base image lives in $VMIMAGES:
# vmctl-base: noble-server-cloudimg-amd64.img
# vmctl-desktop: xfce
# vmctl-distro: ubuntu
# vmctl-ci: push
hostname: noble-xfce
manage_etc_hosts: true
disable_root: false
ssh_pwauth: false
ssh_authorized_keys:
  - @@ROOT_PUBKEY@@
users:
  - name: test
    uid: 1000
    gecos: Test User
    groups: [adm, sudo]
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: test
    sudo: ALL=(ALL) NOPASSWD:ALL
write_files:
  - path: /etc/ssh/sshd_config.d/60-vmctl.conf
    content: "PermitRootLogin prohibit-password\n"
  - path: /etc/modules-load.d/uinput.conf
    content: "uinput\n"
  - path: /etc/vmctl-build.env
    content: |
      FLAVOR=noble-xfce
      DESKTOP=xfce
      DESKTOP_PKG="xubuntu-desktop"
      EXTRA_PKGS="xdotool wmctrl x11-utils x11-xserver-utils"
  - path: /usr/local/sbin/vmctl-build
    permissions: '0755'
    content: |
      @@BUILD_SCRIPT@@
runcmd:
  - [/usr/local/sbin/vmctl-build]
power_state:
  mode: poweroff
  message: vmctl golden build finished
  timeout: 120
