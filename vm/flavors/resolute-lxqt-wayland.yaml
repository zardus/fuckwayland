#cloud-config
# vmctl flavor resolute-lxqt-wayland: Ubuntu 26.04 LTS (resolute) + Lubuntu's LXQt 2.3, run as
# its WAYLAND session on labwc.  SDDM autologin of user test (uid 1000, password test,
# NOPASSWD sudo) into lxqt-wayland.desktop.  Native display tool: `wlr-randr`.
#
# The third desktop in this tree that turns out to be labwc under another name (Budgie and
# Xfce 4.20's Wayland session are the other two), and the pair to resolute-lxqt: the two
# install the same lubuntu-desktop and differ in the session SDDM autologs into, so what
# differs between their runs is the session type and nothing else.  vm/live-smoke.d/
# lxqt-wayland.sh is three assignments and a source -- EDITOR_CLASS, EDITOR_TERM and
# EDITOR_TERM_EXEC=-e for qterminal, then `. labwc.sh` -- for exactly that reason: the
# compositor, the protocols and the backend are labwc's, and only the terminal is Lubuntu's.
#
# Two measured traps, both handled in vm/build-image.sh's desktop_lxqt_wayland and both worth
# reading before touching this file [recon2/openbox B]:
#
#   * startlxqtwayland has a FIRST-RUN branch.  With no compositor configured it picks one
#     into a DIFFERENT config directory (share/lxqt/wayland/firstrun) and starts
#     lxqt-config-session instead of lxqt-session.  Naming labwc in session.conf is what
#     avoids it, and the file is written TWICE: lubuntu-default-settings ships
#     /etc/xdg/xdg-Lubuntu/lxqt/session.conf and a Lubuntu session prepends xdg-Lubuntu to
#     XDG_CONFIG_DIRS, so the plain /etc/xdg copy can lose on the one key that decides the
#     branch.  ~/.config/lxqt/session.conf outranks every system directory and is where the
#     answer really is.
#   * `lubuntu-desktop`, not `lxqt-core`.  lxqt-core hits a panel.conf file conflict and took
#     ~40 min on the loaded dev host; lubuntu-desktop is also what a user installs.
#     `lxqt-wayland-session` carries startlxqtwayland and the session file itself.
#
# SDDM resolves an autologin session name against /usr/share/wayland-sessions FIRST, which is
# what this flavor wants and what the KDE flavors' guard exists to catch -- dm_sddm's
# no_session_ambiguity is kept here anyway, because `lxqt` DOES exist in both directories on
# this image (resolute-lxqt is the X11 half) and only the `-wayland` suffix keeps the two
# apart.
#
# labwc has no `workspace N output ...` equivalent to sway's config, so the rig's head 0 =
# Virtual-1 at (0,0) contract is arranged by /usr/local/bin/vmctl-wlr-layout from XDG
# autostart -- not from ~/.config/labwc, which is not the directory this session's labwc
# reads.  wlroots adds the initial outputs in reverse enumeration order here as everywhere
# else in the family [recon2/labwc 3, recon2/openbox B].
#
# `wlr-randr` is the oracle and it is weaker than sway's: it speaks the very
# zwlr_output_manager_v1 v4 that wxrandr's wlr backend writes through, so tool and oracle
# share a protocol.  The independent readings on this flavor are the host-side screendumps
# vmctl takes per head, and vm/live-smoke.d/labwc.sh says so where it uses them.  `qterminal`
# comes with lubuntu-desktop and is the editor class here; xterm is in EXTRA for the X plane.
#
# vmctl fills in the two @@...@@ placeholders at build time (root ssh public
# key; the contents of vm/build-image.sh). The base image lives in $VMIMAGES:
# vmctl-base: ubuntu-26.04-server-cloudimg-amd64.img
# vmctl-desktop: lxqt-wayland
# vmctl-distro: ubuntu
# vmctl-ci: push
hostname: resolute-lxqt-wayland
manage_etc_hosts: true
disable_root: false
ssh_pwauth: false
ssh_authorized_keys:
  - @@ROOT_PUBKEY@@
users:
  - name: test
    uid: 1000
    gecos: Test User
    groups: [adm, sudo]
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: test
    sudo: ALL=(ALL) NOPASSWD:ALL
write_files:
  # No `owner:` on any entry here.  write_files runs BEFORE the users module, so
  # `owner: test:test` aborts the whole module with `OSError: Unknown user or
  # group ... 'test'` and cloud-init ends in status: error [recon2/hyprland 6].
  # Everything under /home/test is chowned by the build script instead.
  - path: /etc/ssh/sshd_config.d/60-vmctl.conf
    content: "PermitRootLogin prohibit-password\n"
  - path: /etc/modules-load.d/uinput.conf
    content: "uinput\n"
  - path: /etc/vmctl-build.env
    content: |
      FLAVOR=resolute-lxqt-wayland
      DESKTOP=lxqt-wayland
      DESKTOP_PKG="lubuntu-desktop lxqt-wayland-session labwc wlr-randr wl-mirror"
      EXTRA_PKGS="xdotool wmctrl x11-utils x11-xserver-utils xterm"
  - path: /usr/local/sbin/vmctl-build
    permissions: '0755'
    content: |
      @@BUILD_SCRIPT@@
runcmd:
  - [/usr/local/sbin/vmctl-build]
power_state:
  mode: poweroff
  message: vmctl golden build finished
  timeout: 120
