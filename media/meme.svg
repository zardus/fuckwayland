<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <!-- "Reject Modernity, Embrace Tradition" — w11 edition.
       Wayland logo: (c) the Wayland project (CC-BY-SA), via Wikimedia Commons.
       X.Org logo: the X.Org Foundation, via Wikimedia Commons.
       Used nominatively, with love, in a meme. -->
  <rect width="1600" height="520" fill="#0d0f12"/>

  <!-- left panel: modernity, bleak -->
  <rect x="10" y="10" width="780" height="500" fill="#23262d"/>
  <text x="400" y="90" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="bold" fill="#c8ccd4" letter-spacing="6">REJECT MODERNITY</text>
  <g opacity="0.82">
    <image x="270" y="140" width="260" height="260" href="data:image/svg+xml;base64,"/>
  </g>
  <text x="400" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="22"
        fill="#8a8f99" font-style="italic">"we removed that for your own good"</text>

  <g transform="translate(800,-520)">
    <!-- right panel: tradition, glorious -->
    <rect x="10" y="530" width="780" height="500" fill="#3a2e14"/>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#e8b84b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3a2e14" stop-opacity="0"/>
    </radialGradient>
    <rect x="10" y="530" width="780" height="500" fill="url(#glow)"/>
    <g stroke="#f5d67a" stroke-opacity="0.35" stroke-width="7">
      <line x1="400" y1="770" x2="70"  y2="570"/><line x1="400" y1="770" x2="400" y2="545"/>
      <line x1="400" y1="770" x2="730" y2="570"/><line x1="400" y1="770" x2="120" y2="990"/>
      <line x1="400" y1="770" x2="680" y2="990"/><line x1="400" y1="770" x2="60"  y2="770"/>
      <line x1="400" y1="770" x2="740" y2="770"/>
    </g>
    <text x="400" y="615" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="52" font-weight="bold" fill="#ffedb8" letter-spacing="6">EMBRACE TRADITION</text>
    <image x="260" y="650" width="280" height="224" href="data:image/svg+xml;base64,"/>
    <text x="400" y="985" text-anchor="middle" font-family="Georgia, serif" font-size="22"
          fill="#e5c87d" font-style="italic">"it has had a --help since 1984"</text>
  </g>
</svg>
